<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBA Smart Scoreboard</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 680px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      background: #111317;
      color: #f3f4f6;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.1rem;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0;
    }
    .meta {
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .game {
      background: #1c2026;
      border: 1px solid #2d333b;
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      margin-bottom: 0.75rem;
    }
    .game.hot {
      border-color: #f59e0b;
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.25);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      gap: 0.5rem;
    }
    .status {
      font-size: 0.8rem;
      font-weight: 600;
      color: #60a5fa;
    }
    .status.live {
      color: #34d399;
    }
    .status.post {
      color: #9ca3af;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
    }
    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem 0;
    }
    .team-info {
      display: flex;
      gap: 0.5rem;
      align-items: baseline;
    }
    .team-name.winner {
      font-weight: 700;
      color: #ffffff;
    }
    .record {
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .score {
      font-size: 1.15rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .error {
      color: #f87171;
      background: #2a1618;
      border: 1px solid #5c2629;
      padding: 0.85rem 1rem;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>NBA Scoreboard</h1>
    <div class="meta" id="last-updated">Loading...</div>
  </header>
  <main id="scoreboard"></main>

  <script>
    const ENDPOINT = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard";
    const POLL_INTERVAL_MS = 60_000;

    const scoreboardEl = document.getElementById("scoreboard");
    const lastUpdatedEl = document.getElementById("last-updated");

    function getRecordInfo(competitor) {
      const records = competitor.records || [];
      const overall = records.find((r) => r.type === "total" || r.name === "overall");
      const summary = overall?.summary || "";
      const match = summary.match(/^(\d+)-(\d+)/);
      if (!match) {
        return { summary, winPct: 0.5 };
      }
      const wins = Number(match[1]);
      const losses = Number(match[2]);
      const total = wins + losses;
      return {
        summary,
        winPct: total > 0 ? wins / total : 0.5
      };
    }

    function parseClockSeconds(displayClock) {
      if (!displayClock) return 720;
      const parts = String(displayClock).split(":");
      if (parts.length === 2) {
        return Number(parts[0]) * 60 + Number(parts[1]);
      }
      const secs = Number(displayClock);
      return Number.isFinite(secs) ? secs : 720;
    }

    // Higher score = shown higher on the page
    function scoreGameInterest(event) {
      const state = event.status?.type?.state; // "in" | "pre" | "post"
      const comp = event.competitions?.[0];
      const competitors = comp?.competitors || [];
      if (competitors.length < 2) return -9999;

      const recA = getRecordInfo(competitors[0]);
      const recB = getRecordInfo(competitors[1]);
      const combinedWinPct = (recA.winPct + recB.winPct) / 2; // 0.0 to 1.0
      const recordBonus = combinedWinPct * 35; // Up to +35 pts for top teams

      if (state === "in") {
        const period = Number(event.status?.period || 1);
        const secondsLeftInPeriod = parseClockSeconds(event.status?.displayClock);
        const scoreA = Number(competitors[0].score || 0);
        const scoreB = Number(competitors[1].score || 0);
        const margin = Math.abs(scoreA - scoreB);

        // Estimate total regulation seconds remaining (0 in OT)
        const regPeriodsLeft = Math.max(0, 4 - period);
        const totalSecondsLeft = period >= 5 ? 0 : regPeriodsLeft * 720 + secondsLeftInPeriod;

        // Time urgency: ramps up sharply in the 4th quarter and OT
        let timeScore = 0;
        if (period >= 5) {
          timeScore = 65; // Overtime
        } else if (period === 4) {
          // 25 pts at start of 4th, up to 55 pts in the final seconds
          timeScore = 25 + ((720 - Math.min(720, secondsLeftInPeriod)) / 720) * 30;
        } else {
          // 0 to 20 pts across Q1-Q3
          timeScore = ((2880 - totalSecondsLeft) / 2880) * 20;
        }

        // Closeness: 50 pts if tied, tapering down as margin grows
        const closenessScore = Math.max(0, 50 - margin * 2.5);

        // Crunch-time multiplier when close late in the 4th or OT
        const isCrunchTime = period >= 4 && secondsLeftInPeriod <= 300 && margin <= 10;
        const crunchBonus = isCrunchTime ? 30 : 0;

        return {
          priority: 1000 + timeScore + closenessScore + crunchBonus + recordBonus,
          isHot: isCrunchTime || (period >= 5 && margin <= 8),
          badgeText: period >= 5 ? "OT Thriller" : isCrunchTime ? "Crunch Time" : ""
        };
      }

      if (state === "pre") {
        // Upcoming games sit below live games, sorted by team records then tipoff time
        const tipoff = Date.parse(event.date || "") || 0;
        const timeTiebreaker = tipoff ? -tipoff / 1e11 : 0;
        return {
          priority: 500 + recordBonus + timeTiebreaker,
          isHot: false,
          badgeText: ""
        };
      }

      // Finished ("post") games at the bottom, close finishes + good teams higher
      const finalMargin = Math.abs(
        Number(competitors[0].score || 0) - Number(competitors[1].score || 0)
      );
      const closeFinishBonus = Math.max(0, 15 - finalMargin);
      return {
        priority: 100 + recordBonus + closeFinishBonus,
        isHot: false,
        badgeText: ""
      };
    }

    function renderCompetitorRow(competitor, isFinal) {
      const row = document.createElement("div");
      row.className = "team-row";

      const info = document.createElement("div");
      info.className = "team-info";

      const name = document.createElement("span");
      name.className = "team-name";
      if (isFinal && competitor.winner) {
        name.classList.add("winner");
      }
      name.textContent = competitor.team?.displayName || "TBD";

      const { summary } = getRecordInfo(competitor);
      const record = document.createElement("span");
      record.className = "record";
      record.textContent = summary ? `(${summary})` : "";

      info.append(name, record);

      const score = document.createElement("span");
      score.className = "score";
      score.textContent = competitor.score ?? "-";

      row.append(info, score);
      return row;
    }

    function renderGames(events) {
      scoreboardEl.textContent = "";

      if (!events.length) {
        const empty = document.createElement("p");
        empty.className = "meta";
        empty.textContent = "No NBA games scheduled today.";
        scoreboardEl.appendChild(empty);
        return;
      }

      const ranked = events
        .map((event) => ({ event, meta: scoreGameInterest(event) }))
        .sort((a, b) => b.meta.priority - a.meta.priority);

      for (const { event, meta } of ranked) {
        const comp = event.competitions?.[0];
        const competitors = comp?.competitors || [];
        if (competitors.length < 2) continue;

        const away = competitors.find((c) => c.homeAway === "away") || competitors[0];
        const home = competitors.find((c) => c.homeAway === "home") || competitors[1];
        const state = event.status?.type?.state;
        const isFinal = state === "post";

        const card = document.createElement("article");
        card.className = meta.isHot ? "game hot" : "game";

        const header = document.createElement("div");
        header.className = "card-header";

        const status = document.createElement("div");
        status.className = `status ${state || ""}`;
        status.textContent =
          event.status?.type?.shortDetail || event.status?.type?.description || "Scheduled";

        header.appendChild(status);

        if (meta.badgeText) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = meta.badgeText;
          header.appendChild(badge);
        }

        card.append(
          header,
          renderCompetitorRow(away, isFinal),
          renderCompetitorRow(home, isFinal)
        );
        scoreboardEl.appendChild(card);
      }
    }

    async function refreshScoreboard() {
      try {
        const res = await fetch(`${ENDPOINT}?_=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        renderGames(data.events || []);
        lastUpdatedEl.textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        scoreboardEl.textContent = "";
        const errBox = document.createElement("div");
        errBox.className = "error";
        errBox.textContent = `Couldn't load NBA scores: ${err.message}`;
        scoreboardEl.appendChild(errBox);
        lastUpdatedEl.textContent = "Update failed";
      }
    }

    refreshScoreboard();
    setInterval(refreshScoreboard, POLL_INTERVAL_MS);
  </script>
</body>
</html>
