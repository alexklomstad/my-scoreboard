<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Sports Dashboard</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181c23;
      --card-fav: #1b2230;
      --border: #2a303c;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --live: #34d399;
      --pre: #60a5fa;
      --hot: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 1rem 0.9rem 3rem;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }
    h1 {
      font-size: 1.3rem;
      margin: 0;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .meta {
      font-size: 0.8rem;
      color: var(--muted);
    }
    button.refresh-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
    button.refresh-btn:active {
      opacity: 0.75;
    }
    .filters {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.6rem;
      margin-bottom: 0.9rem;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .pill {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.32rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .pill.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
    }
    .section-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 1.1rem 0 0.55rem;
    }
    .game {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      margin-bottom: 0.65rem;
    }
    .game.fav {
      background: var(--card-fav);
      border-color: rgba(59, 130, 246, 0.55);
    }
    .game.hot {
      border-color: var(--hot);
      box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.22);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .league-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.12rem 0.42rem;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.08);
      color: #d1d5db;
    }
    .status {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--pre);
    }
    .status.in { color: var(--live); }
    .status.post { color: var(--muted); }
    .badges {
      display: flex;
      gap: 0.35rem;
      align-items: center;
    }
    .badge {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0.14rem 0.45rem;
      border-radius: 999px;
    }
    .badge.hot {
      background: rgba(251, 191, 36, 0.16);
      color: var(--hot);
    }
    .badge.fav {
      background: rgba(59, 130, 246, 0.22);
      color: #93c5fd;
    }
    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.24rem 0;
    }
    .team-info {
      display: flex;
      align-items: baseline;
      gap: 0.42rem;
      min-width: 0;
    }
    .rank {
      font-size: 0.78rem;
      font-weight: 700;
      color: #fbbf24;
    }
    .team-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .team-name.winner {
      font-weight: 700;
      color: #ffffff;
    }
    .team-name.fav-team {
      color: #93c5fd;
      font-weight: 700;
    }
    .record {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .score {
      font-size: 1.12rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-left: 0.6rem;
    }
    .warning-banner {
      font-size: 0.8rem;
      color: #fca5a5;
      background: rgba(127, 29, 29, 0.35);
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      margin-bottom: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sports Dashboard</h1>
    <div class="header-right">
      <span class="meta" id="last-updated">Loading...</span>
      <button class="refresh-btn" id="refresh-btn" type="button">Refresh</button>
    </div>
  </header>

  <nav class="filters" id="filter-bar"></nav>
  <div id="warnings"></div>
  <main id="dashboard"></main>

  <script>
    const CONFIG = {
      pollIntervalMs: 60_000,
      favoriteTeams: [
        { league: "nfl",   match: ["Minnesota Vikings"],      label: "Vikings" },
        { league: "nba",   match: ["Minnesota Timberwolves"], label: "Timberwolves" },
        { league: "nhl",   match: ["Minnesota Wild"],         label: "Wild" },
        { league: "ncaam", match: ["Arizona Wildcats"],       label: "Arizona MBB" },
        { league: "ncaaf", match: ["Arizona Wildcats"],       label: "Arizona FB" },
        { league: "ncaaw", match: ["Arizona Wildcats"],       label: "Arizona WBB" },
        { league: "mls",   match: ["Portland Timbers"],       label: "Timbers" },
        { league: "epl",   match: ["Liverpool"],              label: "Liverpool" }
      ],
      leagues: [
        {
          id: "nfl",
          label: "NFL",
          type: "football",
          urls: ["https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard"]
        },
        {
          id: "nba",
          label: "NBA",
          type: "basketball4",
          urls: ["https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard"]
        },
        {
          id: "nhl",
          label: "NHL",
          type: "hockey",
          urls: ["https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard"]
        },
        {
          id: "ncaam",
          label: "NCAAM",
          type: "basketball2",
          rankedOrFavOnly: true,
          urls: [
            "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard",
            "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/teams/12"
          ]
        },
        {
          id: "ncaaf",
          label: "NCAAF",
          type: "football",
          rankedOrFavOnly: true,
          urls: [
            "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard",
            "https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/12"
          ]
        },
        {
          id: "ncaaw",
          label: "NCAAW",
          type: "basketball4",
          periodLength: 600,
          rankedOrFavOnly: true,
          urls: [
            "https://site.api.espn.com/apis/site/v2/sports/basketball/womens-college-basketball/scoreboard",
            "https://site.api.espn.com/apis/site/v2/sports/basketball/womens-college-basketball/teams/12"
          ]
        },
        {
          id: "mls",
          label: "MLS",
          type: "soccer",
          urls: ["https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard"]
        },
        {
          id: "epl",
          label: "Premier League",
          type: "soccer",
          urls: ["https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard"]
        }
      ]
    };

    const COLLEGE_SPORT_PATHS = {
      ncaam: "basketball/mens-college-basketball",
      ncaaf: "football/college-football",
      ncaaw: "basketball/womens-college-basketball"
    };

    let activeFilter = "all";
    const gamesByLeague = new Map();
    const failedLeagues = new Set();
    let pollTimer = null;

    const filterBarEl = document.getElementById("filter-bar");
    const warningsEl = document.getElementById("warnings");
    const dashboardEl = document.getElementById("dashboard");
    const lastUpdatedEl = document.getElementById("last-updated");
    const refreshBtn = document.getElementById("refresh-btn");

    function getRecordInfo(competitor, leagueType) {
      const records = competitor.records || [];
      const overall = records.find((r) => r.type === "total" || r.name === "overall");
      const summary = overall?.summary || "";
      const parts = summary.split("-").map(Number);
      if (parts.length >= 2 && parts.every((n) => Number.isFinite(n))) {
        const total = parts.reduce((sum, n) => sum + n, 0);
        if (total <= 0) return { summary, winPct: 0.5 };
        if (leagueType === "hockey" && parts.length === 3) {
          const ptsPct = (parts[0] * 2 + parts[2]) / (total * 2);
          return { summary, winPct: ptsPct };
        }
        return { summary, winPct: parts[0] / total };
      }
      return { summary, winPct: 0.5 };
    }

    function getNumericScore(competitor) {
      const raw = competitor?.score;
      if (typeof raw === "object" && raw !== null) {
        return Number(raw.value ?? raw.displayValue ?? 0) || 0;
      }
      return Number(raw ?? 0) || 0;
    }

    function resolveDisplayScore(competitor, state) {
      const raw = competitor?.score;
      if (typeof raw === "object" && raw !== null) {
        const val = raw.displayValue ?? raw.value;
        if (val !== undefined && val !== null && String(val).trim() !== "") {
          return String(val);
        }
      } else if (raw !== undefined && raw !== null && String(raw).trim() !== "") {
        return String(raw);
      }

      if (Array.isArray(competitor?.linescores) && competitor.linescores.length > 0 && state !== "pre") {
        const sum = competitor.linescores.reduce((acc, ls) => {
          const v = typeof ls === "object" ? Number(ls.value ?? ls.displayValue ?? 0) : Number(ls);
          return acc + (Number.isFinite(v) ? v : 0);
        }, 0);
        return String(sum);
      }

      return state === "pre" ? "-" : "0";
    }

    function parseClockSeconds(displayClock) {
      if (!displayClock) return 0;
      const cleaned = String(displayClock).replace(/[^\d:.]/g, "");
      const parts = cleaned.split(":");
      if (parts.length === 2) {
        return Number(parts[0]) * 60 + Number(parts[1]);
      }
      const secs = Number(cleaned);
      return Number.isFinite(secs) ? secs : 0;
    }

    function parseSoccerMinute(displayClock, period) {
      if (displayClock) {
        const str = String(displayClock).trim();
        const stoppageMatch = str.match(/^(\d+)\s*\+\s*(\d+)/);
        if (stoppageMatch) {
          return Number(stoppageMatch[1]) + Number(stoppageMatch[2]);
        }
        if (str.includes(":")) {
          const cleaned = str.replace(/[^\d:]/g, "");
          const [mins, secs] = cleaned.split(":").map(Number);
          if (Number.isFinite(mins)) {
            return mins + (Number.isFinite(secs) && secs >= 30 ? 1 : 0);
          }
        }
        const digitsOnly = str.replace(/[^\d.]/g, "");
        if (digitsOnly !== "") {
          const minuteNum = Number(digitsOnly);
          if (Number.isFinite(minuteNum)) {
            return Math.floor(minuteNum);
          }
        }
      }
      return (Number(period) || 1) * 45;
    }

    function formatGameStatus(event, state) {
      const shortDetail = event.status?.type?.shortDetail?.trim();
      const description = event.status?.type?.description?.trim();

      if (state === "pre") {
        if (shortDetail && !/^scheduled$/i.test(shortDetail)) {
          return shortDetail;
        }
        if (event.date) {
          const kickoff = new Date(event.date);
          if (Number.isFinite(kickoff.getTime())) {
            const timeStr = kickoff.toLocaleTimeString([], {
              hour: "numeric",
              minute: "2-digit"
            });
            const now = new Date();
            if (kickoff.toDateString() !== now.toDateString()) {
              const dayStr = kickoff.toLocaleDateString([], { weekday: "short" });
              return `${dayStr} ${timeStr}`;
            }
            return timeStr;
          }
        }
      }

      return shortDetail || description || "Scheduled";
    }

    function findFavoriteTeamMatch(leagueId, competitors) {
      for (let i = 0; i < CONFIG.favoriteTeams.length; i++) {
        const fav = CONFIG.favoriteTeams[i];
        if (fav.league !== leagueId) continue;
        for (const comp of competitors) {
          const names = [
            comp.team?.displayName,
            comp.team?.shortDisplayName,
            comp.team?.location
          ]
            .filter(Boolean)
            .map((s) => s.toLowerCase());
          const isMatch = fav.match.some((needle) =>
            names.some((n) => n === needle.toLowerCase() || n.includes(needle.toLowerCase()))
          );
          if (isMatch) {
            return { favIndex: i, label: fav.label, teamId: comp.team?.id };
          }
        }
      }
      return null;
    }

    function hasRankedTeam(competitors) {
      return competitors.some((c) => {
        const rank = c.curatedRank?.current;
        return Number.isFinite(rank) && rank >= 1 && rank <= 25;
      });
    }

    function evaluateGame(event, league, leagueIndex) {
      const comp = event.competitions?.[0];
      const competitors = comp?.competitors || [];
      const state = event.status?.type?.state || "pre";
      const favMatch = findFavoriteTeamMatch(league.id, competitors);
      const sportPreferenceBonus = (CONFIG.leagues.length - leagueIndex) * 2.5;

      const recA = getRecordInfo(competitors[0] || {}, league.type);
      const recB = getRecordInfo(competitors[1] || {}, league.type);
      const rankA = competitors[0]?.curatedRank?.current;
      const rankB = competitors[1]?.curatedRank?.current;
      const rankBoostA = rankA && rankA <= 25 ? (26 - rankA) / 100 : 0;
      const rankBoostB = rankB && rankB <= 25 ? (26 - rankB) / 100 : 0;

      const avgQuality = Math.min(
        1,
        (recA.winPct + recB.winPct) / 2 + (rankBoostA + rankBoostB) / 2
      );
      const recordBonus = avgQuality * 35;

      if (state === "in") {
        const period = Number(event.status?.period || 1);
        const clockSecs = parseClockSeconds(event.status?.displayClock);
        const scoreA = getNumericScore(competitors[0]);
        const scoreB = getNumericScore(competitors[1]);
        const margin = Math.abs(scoreA - scoreB);

        let timeScore = 0;
        let closenessScore = 0;
        let isCrunchTime = false;
        let badgeText = "";

        if (league.type === "soccer") {
          const statusText = [
            event.status?.type?.shortDetail,
            event.status?.type?.detail,
            event.status?.type?.description,
            event.status?.type?.name
          ]
            .filter(Boolean)
            .join(" ");
          const isHalftime =
            /\bHT\b/i.test(statusText) || /half[\s-]?time/i.test(statusText);

          const minute = parseSoccerMinute(event.status?.displayClock, period);
          if (period >= 3 || minute >= 90) {
            timeScore = 60;
          } else if (minute > 80) {
            timeScore = 40 + ((minute - 80) / 15) * 15;
          } else {
            timeScore = (Math.min(80, minute) / 80) * 35;
          }
          closenessScore = margin === 0 ? 50 : margin === 1 ? 42 : margin === 2 ? 18 : 0;
          isCrunchTime = !isHalftime && (minute > 80 || period >= 3) && margin <= 1;
          badgeText = period >= 3 ? "Extra Time" : isCrunchTime ? "Late Drama" : "";
        } else if (league.type === "hockey") {
          const isOT = period > 3;
          const isThird = period === 3;
          if (isOT) {
            timeScore = 65;
          } else if (isThird) {
            const elapsedRatio = (1200 - Math.min(1200, clockSecs)) / 1200;
            timeScore = 25 + elapsedRatio * 30;
          } else {
            const elapsedSecs = (period - 1) * 1200 + (1200 - Math.min(1200, clockSecs));
            timeScore = (elapsedSecs / 3600) * 22;
          }
          closenessScore = margin === 0 ? 50 : margin === 1 ? 44 : margin === 2 ? 20 : 0;
          isCrunchTime = (isThird && clockSecs <= 300 && margin <= 1) || isOT;
          badgeText = period >= 5 ? "Shootout" : isOT ? "OT Thriller" : isCrunchTime ? "Crunch Time" : "";
        } else {
          const regPeriods = league.type === "basketball2" ? 2 : 4;
          const periodLength =
            league.periodLength ??
            (league.type === "basketball2" ? 1200 : league.type === "football" ? 900 : 720);
          const isOT = period > regPeriods;
          const isFinalRegPeriod = period === regPeriods;

          if (isOT) {
            timeScore = 65;
          } else if (isFinalRegPeriod) {
            const elapsedRatio = (periodLength - Math.min(periodLength, clockSecs)) / periodLength;
            timeScore = 25 + elapsedRatio * 30;
          } else {
            const completedPeriods = Math.max(0, period - 1);
            const totalRegSecs = regPeriods * periodLength;
            const elapsedSecs =
              completedPeriods * periodLength + (periodLength - Math.min(periodLength, clockSecs));
            timeScore = (elapsedSecs / totalRegSecs) * 22;
          }

          if (league.type === "football") {
            closenessScore =
              margin <= 3 ? 50 : margin <= 8 ? 44 : margin <= 14 ? 24 : margin <= 17 ? 10 : 0;
            isCrunchTime = (isFinalRegPeriod && clockSecs <= 300 && margin <= 8) || (isOT && margin <= 8);
          } else {
            closenessScore = Math.max(0, 50 - margin * 2.5);
            isCrunchTime = (isFinalRegPeriod && clockSecs <= 300 && margin <= 10) || (isOT && margin <= 10);
          }

          badgeText = isOT ? "OT Thriller" : isCrunchTime ? "Crunch Time" : "";
        }

        const crunchBonus = isCrunchTime ? 30 : 0;
        return {
          event,
          league,
          state,
          favMatch,
          isHot: isCrunchTime,
          badgeText,
          priority: 1000 + timeScore + closenessScore + crunchBonus + recordBonus + sportPreferenceBonus
        };
      }

      if (state === "pre") {
        const tipoff = Date.parse(event.date || "") || 0;
        const timeTiebreaker = tipoff ? -tipoff / 1e12 : 0;
        return {
          event,
          league,
          state,
          favMatch,
          isHot: false,
          badgeText: "",
          priority: 500 + recordBonus + sportPreferenceBonus + timeTiebreaker
        };
      }

      const finalMargin = Math.abs(
        getNumericScore(competitors[0]) - getNumericScore(competitors[1])
      );
      const closeLimit = league.type === "soccer" || league.type === "hockey" ? 1 : 12;
      const closeFinishBonus = finalMargin <= closeLimit ? 12 : 0;

      return {
        event,
        league,
        state,
        favMatch,
        isHot: false,
        badgeText: "",
        priority: 100 + recordBonus + sportPreferenceBonus + closeFinishBonus
      };
    }

    function renderFilters() {
      filterBarEl.textContent = "";
      const items = [{ id: "all", label: "All Sports" }, ...CONFIG.leagues];

      for (const item of items) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `pill ${activeFilter === item.id ? "active" : ""}`;
        btn.textContent = item.label;
        btn.addEventListener("click", () => {
          activeFilter = item.id;
          renderFilters();
          renderDashboard();
        });
        filterBarEl.appendChild(btn);
      }
    }

    function renderCompetitorRow(competitor, state, favTeamId, leagueType) {
      const isFinal = state === "post";
      const row = document.createElement("div");
      row.className = "team-row";

      const info = document.createElement("div");
      info.className = "team-info";

      const rankNum = competitor.curatedRank?.current;
      if (rankNum && rankNum <= 25) {
        const rank = document.createElement("span");
        rank.className = "rank";
        rank.textContent = `#${rankNum}`;
        info.appendChild(rank);
      }

      const name = document.createElement("span");
      name.className = "team-name";
      if (isFinal && competitor.winner) name.classList.add("winner");
      if (favTeamId && competitor.team?.id === favTeamId) name.classList.add("fav-team");
      name.textContent = competitor.team?.displayName || "TBD";

      const { summary } = getRecordInfo(competitor, leagueType);
      const record = document.createElement("span");
      record.className = "record";
      record.textContent = summary ? `(${summary})` : "";

      info.append(name, record);

      const score = document.createElement("span");
      score.className = "score";
      score.textContent = resolveDisplayScore(competitor, state);

      row.append(info, score);
      return row;
    }

    function createGameCard(item) {
      const { event, league, state, favMatch, isHot, badgeText } = item;
      const comp = event.competitions?.[0];
      const competitors = comp?.competitors || [];
      if (competitors.length < 2) return null;

      const first =
        league.type === "soccer"
          ? competitors.find((c) => c.homeAway === "home") || competitors[0]
          : competitors.find((c) => c.homeAway === "away") || competitors[0];
      const second =
        league.type === "soccer"
          ? competitors.find((c) => c.homeAway === "away") || competitors[1]
          : competitors.find((c) => c.homeAway === "home") || competitors[1];

      const card = document.createElement("article");
      card.className = "game";
      if (favMatch) card.classList.add("fav");
      if (isHot) card.classList.add("hot");

      const header = document.createElement("div");
      header.className = "card-header";

      const headerLeft = document.createElement("div");
      headerLeft.className = "header-left";

      const leagueTag = document.createElement("span");
      leagueTag.className = "league-tag";
      leagueTag.textContent = league.label;

      const status = document.createElement("span");
      status.className = `status ${state}`;
      status.textContent = formatGameStatus(event, state);

      headerLeft.append(leagueTag, status);
      header.appendChild(headerLeft);

      const badges = document.createElement("div");
      badges.className = "badges";

      if (favMatch) {
        const favBadge = document.createElement("span");
        favBadge.className = "badge fav";
        favBadge.textContent = favMatch.label;
        badges.appendChild(favBadge);
      }
      if (badgeText) {
        const hotBadge = document.createElement("span");
        hotBadge.className = "badge hot";
        hotBadge.textContent = badgeText;
        badges.appendChild(hotBadge);
      }
      if (badges.childNodes.length > 0) {
        header.appendChild(badges);
      }

      card.append(
        header,
        renderCompetitorRow(first, state, favMatch?.teamId, league.type),
        renderCompetitorRow(second, state, favMatch?.teamId, league.type)
      );
      return card;
    }

    function renderDashboard() {
      warningsEl.textContent = "";
      if (failedLeagues.size > 0) {
        const warn = document.createElement("div");
        warn.className = "warning-banner";
        warn.textContent = `Could not load: ${Array.from(failedLeagues).join(", ")}`;
        warningsEl.appendChild(warn);
      }

      dashboardEl.textContent = "";

      const allGames = Array.from(gamesByLeague.values()).flat();
      const visible =
        activeFilter === "all"
          ? allGames
          : allGames.filter((g) => g.league.id === activeFilter);

      if (!visible.length) {
        const empty = document.createElement("p");
        empty.className = "meta";
        empty.textContent =
          gamesByLeague.size === 0
            ? "Loading games..."
            : "No games on today's scoreboard for this selection.";
        dashboardEl.appendChild(empty);
        return;
      }

      const stateOrder = { in: 0, pre: 1, post: 2 };
      const hasLiveGames = allGames.some((g) => g.state === "in");

      const favGames = visible
        .filter((g) => g.favMatch !== null)
        .sort((a, b) => {
          if (a.favMatch.favIndex !== b.favMatch.favIndex) {
            return a.favMatch.favIndex - b.favMatch.favIndex;
          }
          return (stateOrder[a.state] ?? 9) - (stateOrder[b.state] ?? 9);
        });

      const otherGames = visible
        .filter((g) => g.favMatch === null)
        .sort((a, b) => {
          if (!hasLiveGames && a.state === "pre" && b.state === "pre") {
            const timeA = Date.parse(a.event.date || "") || Number.MAX_SAFE_INTEGER;
            const timeB = Date.parse(b.event.date || "") || Number.MAX_SAFE_INTEGER;
            if (timeA !== timeB) return timeA - timeB;
          }
          return b.priority - a.priority;
        });

      if (favGames.length > 0) {
        const favHeading = document.createElement("div");
        favHeading.className = "section-title";
        favHeading.textContent = "Your Teams";
        dashboardEl.appendChild(favHeading);

        for (const item of favGames) {
          const card = createGameCard(item);
          if (card) dashboardEl.appendChild(card);
        }
      }

      if (otherGames.length > 0) {
        const otherHeading = document.createElement("div");
        otherHeading.className = "section-title";
        otherHeading.textContent = favGames.length > 0 ? "Top Games" : "Games";
        dashboardEl.appendChild(otherHeading);

        for (const item of otherGames) {
          const card = createGameCard(item);
          if (card) dashboardEl.appendChild(card);
        }
      }
    }

    function hydrateScheduleRecords(teamData, events) {
      const teamId = teamData?.id;
      const teamRecords = teamData?.record?.items;
      if (!teamId || !Array.isArray(teamRecords) || !teamRecords.length) {
        return events;
      }
      return events.map((ev) => {
        const comp = ev.competitions?.[0];
        if (!comp?.competitors) return ev;
        const updatedCompetitors = comp.competitors.map((c) => {
          if (String(c.team?.id) === String(teamId) && (!c.records || !c.records.length)) {
            return { ...c, records: teamRecords };
          }
          return c;
        });
        return {
          ...ev,
          competitions: [{ ...comp, competitors: updatedCompetitors }]
        };
      });
    }

    function isCandidateScheduleEvent(ev, now = Date.now()) {
      if (!ev?.id) return false;
      const state = ev.status?.type?.state;
      if (state === "in") return true;
      const eventMs = Date.parse(ev.date || "");
      return Number.isFinite(eventMs) && Math.abs(eventMs - now) <= 36 * 3600 * 1000;
    }

    function extractEventsFromPayload(data) {
      const now = Date.now();
      const isWithinWindow = (ev) => {
        const state = ev.status?.type?.state;
        if (state === "in") return true;
        const t = Date.parse(ev.date || "");
        return Number.isFinite(t) && Math.abs(t - now) <= 36 * 3600 * 1000;
      };

      if (Array.isArray(data?.events)) {
        return hydrateScheduleRecords(data.team, data.events.filter(isWithinWindow));
      }
      if (Array.isArray(data?.team?.nextEvent)) {
        return hydrateScheduleRecords(data.team, data.team.nextEvent.filter(isWithinWindow));
      }
      return [];
    }

    function buildLeagueUrls(league) {
      const baseUrls = [...league.urls];
      if (league.rankedOrFavOnly && COLLEGE_SPORT_PATHS[league.id]) {
        baseUrls.push(
          `https://site.api.espn.com/apis/site/v2/sports/${COLLEGE_SPORT_PATHS[league.id]}/teams/12/schedule`
        );
      }
      return baseUrls;
    }

    async function fetchArizonaEventsFromSchedule(leagueId) {
      const sportPath = COLLEGE_SPORT_PATHS[leagueId];
      if (!sportPath) return [];

      const scheduleUrl = `https://site.api.espn.com/apis/site/v2/sports/${sportPath}/teams/12/schedule`;
      const summaryBase = `https://site.api.espn.com/apis/site/v2/sports/${sportPath}/summary?event=`;

      const res = await fetch(scheduleUrl);
      if (!res.ok) {
        throw new Error(`Schedule HTTP ${res.status} for ${leagueId}`);
      }

      const scheduleData = await res.json();
      const rawEvents = Array.isArray(scheduleData?.events) ? scheduleData.events : [];
      const hydrated = hydrateScheduleRecords(scheduleData?.team, rawEvents);
      const candidateIds = hydrated
        .filter((ev) => isCandidateScheduleEvent(ev))
        .map((ev) => String(ev.id));

      if (!candidateIds.length) {
        return [];
      }

      const summaryResults = await Promise.allSettled(
        candidateIds.map(async (eventId) => {
          const sumRes = await fetch(`${summaryBase}${encodeURIComponent(eventId)}`);
          if (!sumRes.ok) {
            throw new Error(`Summary HTTP ${sumRes.status} for ${eventId}`);
          }
          const summary = await sumRes.json();
          const headerComp = summary?.header?.competitions?.[0];
          const fallbackEv = hydrated.find((e) => String(e.id) === eventId);

          if (!headerComp) {
            return fallbackEv || null;
          }

          return {
            ...(fallbackEv || {}),
            id: String(summary?.header?.id || eventId),
            date: headerComp.date || fallbackEv?.date || "",
            status: headerComp.status || fallbackEv?.status,
            competitions: [headerComp]
          };
        })
      );

      return summaryResults
        .filter((r) => r.status === "fulfilled" && r.value)
        .map((r) => r.value);
    }

    function upsertEventIntoMap(eventMap, ev) {
      if (!ev?.id) return;
      const existing = eventMap.get(ev.id);
      const existingHasScore = existing?.competitions?.[0]?.competitors?.some(
        (c) => c.score !== undefined && c.score !== null && c.score !== ""
      );
      const newHasScore = ev?.competitions?.[0]?.competitors?.some(
        (c) => c.score !== undefined && c.score !== null && c.score !== ""
      );
      if (!existing || (ev.status?.type?.state === "in" && (!existingHasScore || newHasScore))) {
        eventMap.set(ev.id, ev);
      }
    }

    async function fetchLeague(league, leagueIndex) {
      try {
        const urls = buildLeagueUrls(league);
        const results = await Promise.allSettled(
          urls.map(async (url) => {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
          })
        );

        const eventMap = new Map();
        let anySuccess = false;

        for (const result of results) {
          if (result.status !== "fulfilled") continue;
          anySuccess = true;
          for (const ev of extractEventsFromPayload(result.value)) {
            upsertEventIntoMap(eventMap, ev);
          }
        }

        if (league.rankedOrFavOnly && COLLEGE_SPORT_PATHS[league.id]) {
          try {
            const enrichedEvents = await fetchArizonaEventsFromSchedule(league.id);
            if (enrichedEvents.length > 0) {
              anySuccess = true;
              for (const ev of enrichedEvents) {
                upsertEventIntoMap(eventMap, ev);
              }
            }
          } catch (_) {
            // Keep scoreboard/schedule results if schedule->summary lookup fails
          }
        }

        if (!anySuccess) {
          throw new Error("All endpoints failed");
        }

        const evaluated = [];
        for (const ev of eventMap.values()) {
          const item = evaluateGame(ev, league, leagueIndex);
          if (league.rankedOrFavOnly) {
            const competitors = ev.competitions?.[0]?.competitors || [];
            if (!item.favMatch && !hasRankedTeam(competitors)) continue;
          }
          evaluated.push(item);
        }

        failedLeagues.delete(league.id);
        gamesByLeague.set(league.id, evaluated);
      } catch (err) {
        failedLeagues.add(league.label);
      } finally {
        renderDashboard();
      }
    }

    async function refreshAll() {
      lastUpdatedEl.textContent = "Updating...";
      await Promise.all(
        CONFIG.leagues.map((league, idx) => fetchLeague(league, idx))
      );
      lastUpdatedEl.textContent = `Updated ${new Date().toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      })}`;
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(() => {
        if (document.visibilityState === "visible") {
          refreshAll();
        }
      }, CONFIG.pollIntervalMs);
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        refreshAll();
        startPolling();
      } else {
        stopPolling();
      }
    });

    refreshBtn.addEventListener("click", refreshAll);

    renderFilters();
    refreshAll();
    startPolling();
  </script>
</body>
</html>
